# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# The lane's test is "can this change what CI validates?". Markdown outside
# the module trees is documentation and nothing else -- README.md, AGENTS.md
# and TODO.md describe the library rather than produce it, and nothing
# packages them.
#
# The two module trees are named first, and before the general markdown rule,
# because an AAR can package a resource of any extension: a markdown file
# under logging-android/src/main/ is a build input whatever it is called, and
# without these rules the later `docs **/*.md` would wave it through. Order is
# what makes that hold -- the first matching rule wins, so a more specific
# rule placed after the general one never gets asked.
#
# `**`, not `*`: path.matchesGlob's `*` never crosses `/`.
code logging-core/**
code logging-android/**
docs **/*.md

# The one subject prefix the docs lane accepts. The wider housekeeping table
# in AGENTS.md (test:, build:, refactor:) names categories this lane can never
# actually admit: every file it accepts is markdown outside the modules, so a
# commit that really was test, build, or refactor work would carry another
# file and ride the code lane instead. Accepting those three would have the
# required gate blessing subjects that describe work the diff cannot contain.
prefixes docs

# ci.yml declares no workflow_dispatch trigger, so no dispatched run is
# legitimate here: a PR-less dispatch is refused on every ref.
dispatch-without-pr refuse
